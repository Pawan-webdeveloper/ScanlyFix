name: CI

# Typecheck and test on every push and pull request. The live database tests
# are gated behind SCANLYFIX_DB and skip here — everything else (checks, web,
# mcp, scanner, and the db package's non-live tests) runs with no secrets.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in flight, so CI never
# queues behind stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
     NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
